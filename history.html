<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Browsing History</title>
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; connect-src 'self' https://wttr.in https://nominatim.openstreetmap.org https://api.open-meteo.com https://api.rss2json.com https://feeds.reuters.com https://newsapi.org https://openweathermap.org https://api.openweathermap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests;"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="history-ui.css" />
        <style>
            body {
                margin: 0;
                padding: 28px 18px;
                background: var(--settings-bg, #f8f9fa);
                color: var(--settings-header-color, #202124);
                font-family:
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            .history-shell {
                max-width: 1000px;
                margin: 0 auto;
            }
            .history-container {
                border: 1px solid var(--border-color, #e8eaed);
                border-radius: 14px;
                background: var(--section-bg, #fff);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
                overflow: hidden;
            }
            .history-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
                padding: 18px 18px 14px;
                border-bottom: 1px solid var(--border-color, #e8eaed);
                background: var(--settings-header-bg, #fff);
            }

            .history-title-block {
                min-width: 0;
            }

            .history-title-left {
                margin: 0;
                font-size: 1.2rem;
                font-weight: 650;
                letter-spacing: -0.01em;
            }

            .history-subtitle {
                margin: 4px 0 0;
                font-size: 0.88rem;
                color: #6f7276;
            }

            .history-controls {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-shrink: 0;
            }

            .history-filters { display: flex; align-items: end; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border-color, #e8eaed); background: var(--settings-header-bg, #fff); flex-wrap: wrap; }
            .history-filter-field { display: flex; flex-direction: column; gap: 4px; color: #6f7276; font-size: 0.75rem; font-weight: 600; }
            .history-filter-field input { min-height: 34px; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border-color, #e8eaed); border-radius: 8px; background: var(--section-bg, #fff); color: var(--settings-header-color, #202124); font: inherit; font-weight: 400; color-scheme: light dark; }
            .history-filter-result { margin-left: auto; align-self: center; color: #6f7276; font-size: 0.8rem; }

            .btn-secondary {
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid var(--border-color, #e8eaed);
                background: var(--settings-header-bg, #fff);
                color: var(--settings-header-color, #202124);
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition:
                    background-color 0.14s ease,
                    border-color 0.14s ease;
            }

            .btn-secondary:hover {
                border-color: var(--accent-color-light, #1a73e8);
            }

            .btn-secondary.primary {
                background: var(--accent-color-light, #1a73e8);
                border-color: var(--accent-color-light, #1a73e8);
                color: #fff;
            }

            .btn-secondary.primary:hover {
                background: var(--accent-hover, #1557b0);
                border-color: var(--accent-hover, #1557b0);
            }

            .btn-secondary.danger {
                background: #d93025;
                border-color: #c5221f;
                color: #fff;
            }

            .btn-secondary.danger:hover {
                background: #b8261f;
                border-color: #b8261f;
            }

            .history-list {
                max-height: calc(100vh - 285px);
                overflow-y: auto;
                padding: 8px 12px 14px;
            }

            html::-webkit-scrollbar,
            .history-list::-webkit-scrollbar {
                width: 8px;
                background: transparent;
            }

            html::-webkit-scrollbar-track,
            .history-list::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.06);
                border-radius: 8px;
            }

            html::-webkit-scrollbar-thumb,
            .history-list::-webkit-scrollbar-thumb {
                background: rgba(95, 99, 104, 0.55);
                border-radius: 8px;
            }

            html::-webkit-scrollbar-thumb:hover,
            .history-list::-webkit-scrollbar-thumb:hover {
                background: rgba(95, 99, 104, 0.8);
            }

            .history-item {
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid var(--border-color, #e8eaed);
                border-radius: 10px;
                background: var(--section-bg, #fff);
                padding: 10px 12px;
                margin-top: 8px;
                cursor: pointer;
                transition:
                    border-color 0.15s ease,
                    background-color 0.15s ease;
            }

            .history-item:hover {
                border-color: var(--accent-color-light, #1a73e8);
            }

            .history-favicon {
                width: 18px;
                height: 18px;
                border-radius: 4px;
                flex-shrink: 0;
            }

            .history-text {
                min-width: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .history-item-time { flex: 0 0 auto; color: #6f7276; font-size: 0.78rem; line-height: 1.35; text-align: right; white-space: pre-line; }

            .history-title {
                font-size: 0.95rem;
                color: var(--settings-header-color, #202124);
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .history-meta {
                color: #6f7276;
                font-size: 0.8rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .no-history {
                color: #7a7d81;
                text-align: center;
                margin: 24px 0;
                border: 1px dashed var(--border-color, #e8eaed);
                border-radius: 10px;
                padding: 18px 12px;
                background: var(--section-bg, #fff);
            }

            body.theme-dark .history-item,
            body.theme-dark-purple .history-item,
            body.theme-dark-nord .history-item,
            body.theme-dark-forest .history-item,
            body.theme-dark-rose .history-item,
            body.theme-dark .no-history,
            body.theme-dark-purple .no-history,
            body.theme-dark-nord .no-history,
            body.theme-dark-forest .no-history,
            body.theme-dark-rose .no-history {
                background: rgba(0, 0, 0, 0.12);
                border-color: #40454f;
            }

            body.theme-dark .history-title,
            body.theme-dark-purple .history-title,
            body.theme-dark-nord .history-title,
            body.theme-dark-forest .history-title,
            body.theme-dark-rose .history-title {
                color: #e7eaf0;
            }

            body.theme-dark .history-meta,
            body.theme-dark-purple .history-meta,
            body.theme-dark-nord .history-meta,
            body.theme-dark-forest .history-meta,
            body.theme-dark-rose .history-meta,
            body.theme-dark .history-item-time,
            body.theme-dark-purple .history-item-time,
            body.theme-dark-nord .history-item-time,
            body.theme-dark-forest .history-item-time,
            body.theme-dark-rose .history-item-time,
            body.theme-dark .history-subtitle,
            body.theme-dark-purple .history-subtitle,
            body.theme-dark-nord .history-subtitle,
            body.theme-dark-forest .history-subtitle,
            body.theme-dark-rose .history-subtitle,
            body.theme-dark .no-history,
            body.theme-dark-purple .no-history,
            body.theme-dark-nord .no-history,
            body.theme-dark-forest .no-history,
            body.theme-dark-rose .no-history {
                color: #aeb4bf;
            }

            @media (max-width: 700px) {
                body {
                    padding: 14px;
                }
                .history-header {
                    flex-direction: column;
                    align-items: stretch;
                }
                .history-controls {
                    width: 100%;
                }
                .history-controls button {
                    flex: 1;
                }
            }
        </style>
    </head>
    <body>
        <div class="history-shell">
            <div class="history-container">
                <div class="history-header">
                    <div class="history-title-block">
                        <h1 class="history-title-left">Browsing History</h1>
                        <p class="history-subtitle">
                            Recent pages from this browser profile.
                        </p>
                    </div>
                    <div class="history-controls">
                        <button
                            id="refresh-history-btn"
                            class="btn-secondary primary"
                        >
                            Refresh
                        </button>
                        <button
                            id="clear-history-btn"
                            class="btn-secondary danger"
                        >
                            Clear
                        </button>
                    </div>
                </div>
                <div class="history-filters" aria-label="History filters">
                    <label class="history-filter-field">From date<input id="history-date-from" type="date" /></label>
                    <label class="history-filter-field">To date<input id="history-date-to" type="date" /></label>
                    <label class="history-filter-field">From time<input id="history-time-from" type="time" /></label>
                    <label class="history-filter-field">To time<input id="history-time-to" type="time" /></label>
                    <button id="clear-history-filters-btn" class="btn-secondary">Reset filters</button>
                    <span id="history-filter-result" class="history-filter-result" aria-live="polite"></span>
                </div>
                <div id="history-list" class="history-list"></div>
            </div>
        </div>
        <script src="history.js"></script>
    </body>
</html>
